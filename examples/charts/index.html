<body><main><nav aria-label="모음 라이브러리"><a href="../grid/index.html">그리드</a><a href="../charts/index.html" aria-current="page">차트</a><a href="../gantt/index.html">간트</a><a href="../uploader/index.html">업로더</a><a href="../calendar/index.html">캘린더</a><a href="../datepicker/index.html">날짜 선택</a><a href="../pagination/index.html">페이지네이션</a><a href="../infinite-scroll/index.html">무한 스크롤</a></nav><header class="intro"><p class="eyebrow">MOUM / CHARTS 0.2.0</p><h1>숫자의 흐름을, 한눈에.</h1><p>프레임워크 없이 사용하는 SVG 차트. 범례로 계열을 비교하고, 항목을 선택해 정확한 값을 확인하세요. 아래는 기능 확인용 예제 데이터입니다.</p></header>
<section aria-label="차트 예제"><div class="demo-tools"><label>차트 유형 <select id="chart-type"><option value="bar">세로 막대</option><option value="horizontalBar">가로 막대</option><option value="stackedBar">누적 세로 막대</option><option value="stackedHorizontalBar">누적 가로 막대</option><option value="line">선</option><option value="area">영역</option><option value="pie">원형</option><option value="donut">도넛</option><option value="scatter">산점도</option></select></label><button id="export" type="button">SVG 다운로드</button><button id="empty" type="button">빈 데이터</button><button id="reset" type="button">예제 복원</button></div><div id="chart"></div><p class="demo-help">범례는 마우스와 키보드로 켜고 끌 수 있습니다. 차트 항목은 Enter·Space로 선택할 수 있고, 데이터 표에서 모든 원본 값을 읽을 수 있습니다.</p><output tabindex="0" id="result" class="demo-output" aria-live="polite">항목 선택 결과가 여기에 표시됩니다.</output></section>
<footer>독립 패키지 <code>@moum/charts</code> · 외부 요청 없음 · <a href="../../packages/charts/README.md">API·사용법</a></footer></main><script src="../../packages/charts/dist/moum-charts.js"></script><script src="demo.js"></script></body></html>
