<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOUM Grid · 빠른 시작</title>
  <!-- 다른 프로젝트에서는 복사한 JS/CSS의 경로로 바꾸세요. -->
  <link rel="stylesheet" href="../../packages/grid/dist/moum-grid.css">
  <style>pre { white-space: pre-wrap; overflow-wrap: anywhere; }</style>
</head>
<body>
  <main>
    <h1>MOUM Grid 빠른 시작</h1>
    <p>셀을 편집하거나 Excel에서 여러 셀을 붙여넣어 보세요. Ctrl+Z / Ctrl+Y로 되돌리고 다시 실행합니다.</p>
    <div id="grid"></div>
    <p>
      <button id="read-data" type="button">현재 데이터 확인</button>
      <button id="replace-data" type="button">다른 데이터 불러오기</button>
    </p>
    <pre id="result" role="status" aria-live="polite"></pre>
  </main>
  <script src="../../packages/grid/dist/moum-grid.js"></script>
  <script>
    const grid = new MoumGrid('#grid', {
      label: '품목 편집',
      columns: [
        { field: 'code', header: '코드', editable: false },
        { field: 'name', header: '품목', defaultValue: '신규 품목' },
        { field: 'qty', header: '수량', type: 'number', defaultValue: 0 }
      ],
      data: [
        { code: 'A001', name: '노트', qty: 10 },
        { code: 'A002', name: '볼펜', qty: 20 }
      ],
      onChange: ({ reason, data }) => {
        document.querySelector('#result').textContent = reason + '\n' + JSON.stringify(data, null, 2);
      }
    });
    document.querySelector('#read-data').addEventListener('click', () => {
      if (!grid.finishEdit()) return;
      document.querySelector('#result').textContent = JSON.stringify(grid.getData(), null, 2);
    });
    document.querySelector('#replace-data').addEventListener('click', () => {
      grid.setData([{ code: 'B001', name: '새 조회 결과', qty: 5 }]);
      document.querySelector('#result').textContent = '데이터를 교체했습니다. 이전 편집 이력은 초기화됩니다.';
    });
  </script>
</body>
</html>
