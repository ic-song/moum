name: 버그 제보
description: 재현 가능한 오류를 알려주세요.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '개인정보·토큰·실제 업무 파일은 첨부하지 마세요. 취약점은 SECURITY.md를 먼저 확인하세요.'
  - type: input
    id: version
    attributes:
      label: MOUM 버전과 사용 모듈
      placeholder: '@moum/grid 0.7.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 브라우저·OS·실행 방식
      placeholder: 'Chrome 버전 / Windows / JSP HTTP 또는 React'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 순서와 최소 코드
      description: '로컬/서버 모드, 복구 사용 여부, 입력과 실제 결과를 포함하세요.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 근거
      description: '민감정보를 제거한 로그·스크린샷. 검사하지 않은 환경도 구분해주세요.'
