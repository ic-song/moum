name: Package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run pack:offline
      - uses: actions/upload-artifact@v4
        with:
          name: moum-offline
          path: output/moum-offline.tar.gz
          if-no-files-found: error
          retention-days: 30
