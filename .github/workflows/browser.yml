name: Browser
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - name: Run integration checks
        shell: bash
        run: |
          node scripts/serve.mjs > /tmp/moum-demo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node -e "(async()=>{for(let i=0;i<100;i++){try{if((await fetch('http://127.0.0.1:4173/examples/grid/index.html')).ok)return;}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1)})()"
          npm run test:browser
          npm run test:recovery
          npm run test:resilience
          npm run test:usage
          npm run test:suite-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright
          retention-days: 7
